[package]
name = "urls"
version = "0.1.0"
edition = "2024"
description = "Zero-storage URL compressor and portable link container"
authors = ["Femar"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = "1.5"
bytes = "1"
memmap2 = "0.9"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zstd = { version = "0.13", features = ["zdict_builder"] }

[dev-dependencies]
tempfile = "3.17"
